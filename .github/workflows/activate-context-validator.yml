name: Activate context-backed validator

on:
  push:
    branches: [refactor_validator]

permissions:
  contents: write

jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Activate validator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('source/ProofLogic.py')
          text = path.read_text()
          marker = '\n\nif __name__ == "__main__":\n'
          activation = '\n\n# The validator implementation is backed by ProofContext.  Keep the\n# original implementation above temporarily as a migration reference;\n# this binding makes the context-backed implementation authoritative.\nfrom SyLoPy.source.ContextProofValidator import ProofValidator as ProofValidator\n'
          if 'ContextProofValidator import ProofValidator as ProofValidator' not in text:
              if marker not in text:
                  raise SystemExit('ProofLogic activation marker not found')
              text = text.replace(marker, activation + marker, 1)
              path.write_text(text)
          PY
          rm -f source/ProofLogic_refactor_notes.txt
          rm -f .github/workflows/activate-context-validator.yml
          python3 -m pytest -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/ProofLogic.py source/ProofLogic_refactor_notes.txt .github/workflows/activate-context-validator.yml source/ContextProofValidator.py
          git commit -m 'make ProofContext authoritative for validator scope'
          git push

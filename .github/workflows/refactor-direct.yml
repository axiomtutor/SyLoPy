name: Direct ProofContext refactor

on:
  push:
    branches:
      - refactor_validator
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply direct ProofContext refactor
        run: |
          cat > /tmp/direct_refactor.py <<'PY'
          from __future__ import annotations
          import ast, builtins, re
          from pathlib import Path

          root = Path.cwd()
          logic_path = root / 'source' / 'ProofLogic.py'
          logic = logic_path.read_text()
          tree = ast.parse(logic)
          validator_node = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'ProofValidator')
          lines = logic.splitlines(keepends=True)
          class_source = ''.join(lines[validator_node.lineno - 1:validator_node.end_lineno])
          class_tree = ast.parse(class_source).body[0]

          def method_source(node):
              return ''.join(lines[validator_node.lineno - 1 + node.lineno - 1:
                                    validator_node.lineno - 1 + node.end_lineno])

          validate_node = next(n for n in class_tree.body
                               if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == 'validate')
          validate_old = method_source(validate_node)
          validate_new = '''    def validate(self, entries: list) -> Tuple[bool, Optional[ValidationError], Optional[SubproofRecord]]:\n        """Validate entries using one lexical ProofContext and ordered proof history."""\n        seen: list = []\n        context = ProofContext()\n        for declaration in self.initial_declarations:\n            try:\n                context.declare(declaration)\n            except DuplicateBindingError:\n                existing = context.lookup_declaration(declaration.name)\n                return False, _mk_error(\n                    None, None, 0, CATEGORY_DECLARATION_CONFLICT,\n                    f"symbol '{declaration.name}' is already declared as "\n                    f"{existing.kind if existing else 'another symbol kind'}",\n                ), None\n        return self._validate_block(entries, None, seen, context, outer_context=seen)\n\n'''
          class_source = class_source.replace(validate_old, validate_new, 1)
          class_source = re.sub(r'labels\s*:\s*LabelScope\s*,\s*declarations\s*:\s*DeclarationScope',
                                'context: ProofContext', class_source)

          class_tree = ast.parse(class_source).body[0]
          pieces = []
          class_lines = class_source.splitlines(keepends=True)
          for node in class_tree.body:
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) or node.name == '__init__':
                  continue
              start = sum(len(x) for x in class_lines[:node.lineno - 1])
              end = sum(len(x) for x in class_lines[:node.end_lineno])
              old = class_source[start:end]
              new = re.sub(r'\blabels\b', 'context', old)
              new = re.sub(r'\bdeclarations\b', 'context', new)
              new = re.sub(r'context\.child\(\)\s*,\s*context\.child\(\)', 'context.child()', new)
              new = re.sub(r'\bcontext\s*,\s*context\b', 'context', new)
              new = new.replace('context.lookup(', 'context.lookup_declaration(')
              new = re.sub(r'if\s+(\w+)\s+not\s+in\s+context\s*:', r'if context.lookup_label(\1) is None:', new)
              new = re.sub(r'if\s+(\w+)\s+not\s+in\s+context\b', r'if context.lookup_label(\1) is None', new)
              new = re.sub(r'\bcontext\[([^\]]+)\]\s*=\s*([^\n]+)', r'context.bind_label(\1, \2)', new)
              new = re.sub(r'\bcontext\[([^\]]+)\]', r'context.require_label(\1).value', new)
              if 'LabelScope' in new or 'DeclarationScope' in new or re.search(r'\b(labels|declarations)\b', new):
                  raise RuntimeError(f'legacy scope identifier remains in method {node.name}')
              pieces.append((start, end, new))
          for start, end, new in reversed(pieces):
              class_source = class_source[:start] + new + class_source[end:]

          transformed_tree = ast.parse(class_source)
          transformed_class = transformed_tree.body[0]
          block = next(n for n in transformed_class.body if isinstance(n, ast.FunctionDef) and n.name == '_validate_block')
          positional_names = [a.arg for a in block.args.args]
          if 'context' not in positional_names or 'labels' in positional_names or 'declarations' in positional_names:
              raise RuntimeError(f'bad _validate_block signature: {positional_names}')

          loaded = {n.id for n in ast.walk(transformed_class) if isinstance(n, ast.Name) and isinstance(n.ctx, ast.Load)}
          builtin_names = set(dir(builtins)) | {
              'Any','Dict','Iterable','Iterator','List','NamedTuple','Optional','Tuple','Union',
              'ProofContext','DuplicateBindingError','UnknownBindingError','itertools','re'
          }
          pl = __import__('SyLoPy.source.ProofLogic', fromlist=['*'])
          import_lines = [f'{name} = pl.{name}' for name in sorted(loaded - builtin_names - {'ProofValidator'}) if hasattr(pl, name)]

          validator_module = '''"""Proof validation driven by one lexical ProofContext."""\n\nfrom __future__ import annotations\nfrom typing import *\nimport itertools\nimport re\nfrom .ProofContext import DuplicateBindingError, ProofContext, UnknownBindingError\nfrom . import ProofLogic as pl\n\n''' + '\n'.join(import_lines) + '\n\n' + class_source + '\n\n__all__ = ["ProofValidator"]\n'
          (root / 'source' / 'ProofValidator.py').write_text(validator_module)

          old = '''        validator = ProofValidator(\n            self.rules, self.premises, self.axioms,\n            declarations=self.declarations,\n        )'''
          new = '''        from .ProofValidator import ProofValidator as ContextProofValidator\n        validator = ContextProofValidator(\n            self.rules, self.premises, self.axioms,\n            declarations=self.declarations,\n        )'''
          if old not in logic:
              raise RuntimeError('could not find Proof.check_detailed validator construction')
          logic_path.write_text(logic.replace(old, new, 1))
          adapter = root / 'source' / 'ContextProofValidator.py'
          if adapter.exists(): adapter.unlink()

          (root / 'tests' / 'test_proof_validator_context_integration.py').write_text('''from SyLoPy.source.ProofContext import ProofContext, DuplicateBindingError\nfrom SyLoPy.source.ProofValidator import ProofValidator\n\n\ndef test_validator_context_scopes():\n    context = ProofContext()\n    context.bind_label("L1", "formula")\n    child = context.child()\n    child.bind_label("L2", "child-formula")\n    assert child.require_label("L1").value == "formula"\n    assert context.lookup_label("L2") is None\n\n\ndef test_context_namespace_rejects_declaration_label_collision():\n    context = ProofContext()\n    class Declaration:\n        name = "x"\n    context.declare(Declaration())\n    try:\n        context.bind_label("x", "formula")\n    except DuplicateBindingError:\n        pass\n    else:\n        raise AssertionError("declaration and label must share the proof namespace")\n\n\ndef test_direct_validator_has_context_state():\n    assert "context" in ProofValidator._validate_block.__code__.co_varnames\n''')
          ast.parse(logic_path.read_text())
          ast.parse((root / 'source' / 'ProofValidator.py').read_text())
          print('direct validator refactor generated successfully')
          PY
          python /tmp/direct_refactor.py
          python -m pip install -r requirements-test.txt
          bash run_tests.sh
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- source/ProofLogic.py source/ProofValidator.py source/ContextProofValidator.py tests/test_proof_validator_context_integration.py
          git rm -f --ignore-unmatch .github/workflows/refactor-direct.yml
          git commit -m 'refactor validator to use ProofContext directly'
          git push

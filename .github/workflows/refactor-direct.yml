name: Direct ProofContext refactor

on:
  push:
    branches:
      - refactor_validator

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply direct validator refactor
        run: |
          cat > /tmp/direct_refactor.py <<'PY'
          from __future__ import annotations

          import ast
          import builtins
          import re
          from pathlib import Path

          root = Path.cwd()
          logic_path = root / 'source' / 'ProofLogic.py'
          logic = logic_path.read_text()
          tree = ast.parse(logic)

          validator_node = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'ProofValidator')
          lines = logic.splitlines(keepends=True)
          class_source = ''.join(lines[validator_node.lineno - 1:validator_node.end_lineno])
          class_tree = ast.parse(class_source).body[0]

          def method_source(node):
              return ''.join(lines[validator_node.lineno - 1 + node.lineno - 1:
                                    validator_node.lineno - 1 + node.end_lineno])

          # Replace the validator's validate entry point completely.  This is
          # the one place that constructs the lexical environment.
          validate_node = next(n for n in class_tree.body
                               if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == 'validate')
          validate_old = method_source(validate_node)
          validate_new = '''    def validate(self, entries: list) -> Tuple[bool, Optional[ValidationError], Optional[SubproofRecord]]:\n        """Validate entries using one lexical ProofContext and ordered proof history."""\n        seen: list = []\n        context = ProofContext()\n        for declaration in self.initial_declarations:\n            try:\n                context.declare(declaration)\n            except DuplicateBindingError:\n                existing = context.lookup_declaration(declaration.name)\n                return False, _mk_error(\n                    None, None, 0, CATEGORY_DECLARATION_CONFLICT,\n                    f"symbol '{declaration.name}' is already declared as "\n                    f"{existing.kind if existing else 'another symbol kind'}",\n                ), None\n        return self._validate_block(\n            entries, None, seen, context, outer_context=seen,\n        )\n\n'''
          class_source = class_source.replace(validate_old, validate_new)

          # All methods except __init__ use the lexical context.  The old
          # implementation had two parameters (labels/declarations); replace
          # those names mechanically, then collapse the duplicate arguments
          # produced at call sites.
          class_source = re.sub(
              r'labels\s*:\s*LabelScope\s*,\s*declarations\s*:\s*DeclarationScope',
              'context: ProofContext', class_source,
          )

          # Apply the identifier migration only to methods other than __init__.
          # __init__'s public declarations= argument is unrelated to lexical
          # scope and must remain unchanged.
          class_tree = ast.parse(class_source).body[0]
          pieces = []
          cursor = 0
          for node in class_tree.body:
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) or node.name == '__init__':
                  continue
              start = sum(len(x) for x in class_source.splitlines(keepends=True)[:node.lineno - 1])
              end = sum(len(x) for x in class_source.splitlines(keepends=True)[:node.end_lineno])
              old = class_source[start:end]
              new = re.sub(r'\blabels\b', 'context', old)
              new = re.sub(r'\bdeclarations\b', 'context', new)
              # The replacement above turns calls such as
              # context.child(), context.child() into duplicate arguments.
              new = re.sub(r'context\.child\(\)\s*,\s*context\.child\(\)', 'context.child()', new)
              new = re.sub(r'\bcontext\s*,\s*context\b', 'context', new)
              new = new.replace('context.lookup(', 'context.lookup_declaration(')

              # Translate label lookups/updates to the explicit ProofContext API.
              new = re.sub(r'if\s+(\w+)\s+not\s+in\s+context\s*:',
                           r'if context.lookup_label(\1) is None:', new)
              new = re.sub(r'if\s+(\w+)\s+not\s+in\s+context\b',
                           r'if context.lookup_label(\1) is None', new)
              new = re.sub(r'\bcontext\[([^\]]+)\]\s*=\s*([^\n]+)',
                           r'context.bind_label(\1, \2)', new)
              new = re.sub(r'\bcontext\[([^\]]+)\]',
                           r'context.require_label(\1).value', new)

              if 'LabelScope' in new or 'DeclarationScope' in new:
                  raise RuntimeError(f'legacy scope name remains in method {node.name}')
              if re.search(r'\b(labels|declarations)\b', new):
                  raise RuntimeError(f'legacy scope identifier remains in method {node.name}')
              pieces.append((start, end, new))

          for start, end, new in reversed(pieces):
              class_source = class_source[:start] + new + class_source[end:]

          # Re-parse after transformation and make sure the validator has the
          # desired public state signature.
          transformed_tree = ast.parse(class_source)
          transformed_class = transformed_tree.body[0]
          block = next(n for n in transformed_class.body
                       if isinstance(n, ast.FunctionDef) and n.name == '_validate_block')
          positional_names = [a.arg for a in block.args.args]
          if 'context' not in positional_names or 'labels' in positional_names or 'declarations' in positional_names:
              raise RuntimeError(f'bad _validate_block signature: {positional_names}')

          # Determine every module-level symbol referenced by the extracted
          # validator.  The new module aliases these from ProofLogic so the
          # rule implementations remain untouched.
          loaded = set()
          for node in ast.walk(transformed_class):
              if isinstance(node, ast.Name) and isinstance(node.ctx, ast.Load):
                  loaded.add(node.id)
          builtin_names = set(dir(builtins)) | {
              'Any', 'Dict', 'Iterable', 'Iterator', 'List', 'NamedTuple',
              'Optional', 'Tuple', 'Union', 'ProofContext',
              'DuplicateBindingError', 'UnknownBindingError',
              'itertools', 're',
          }
          aliases = sorted(name for name in loaded
                           if name not in builtin_names and name != 'ProofValidator')

          alias_lines = []
          for name in aliases:
              alias_lines.append(f'{name} = pl.{name}')

          validator_module = '''"""Proof validation driven by one lexical ProofContext.\n\nThis module owns validator state management while ProofLogic continues to\nown the inference-rule implementations.  `seen` is ordered proof history;\n`ProofContext` is the sole lexical environment for declarations and labels.\n"""\n\nfrom __future__ import annotations\n\nfrom typing import *\nimport itertools\nimport re\n\nfrom .ProofContext import DuplicateBindingError, ProofContext, UnknownBindingError\nfrom . import ProofLogic as pl\n\n''' + '\n'.join(alias_lines) + '\n\n' + class_source + '\n\n__all__ = ["ProofValidator"]\n'
          (root / 'source' / 'ProofValidator.py').write_text(validator_module)

          # Make Proof.check_detailed use the new validator.  A local import
          # avoids a module cycle: ProofValidator imports ProofLogic for the
          # existing rule/data definitions.
          old = '''        validator = ProofValidator(\n            self.rules, self.premises, self.axioms,\n            declarations=self.declarations,\n        )'''
          new = '''        from .ProofValidator import ProofValidator as ContextProofValidator\n        validator = ContextProofValidator(\n            self.rules, self.premises, self.axioms,\n            declarations=self.declarations,\n        )'''
          if old not in logic:
              raise RuntimeError('could not find Proof.check_detailed validator construction')
          logic = logic.replace(old, new, 1)
          logic_path.write_text(logic)

          # The adapter is no longer part of the implementation.
          adapter = root / 'source' / 'ContextProofValidator.py'
          if adapter.exists():
              adapter.unlink()

          # Add focused integration tests if they do not already exist.
          test_path = root / 'tests' / 'test_proof_validator_context_integration.py'
          test_path.write_text('''from SyLoPy.source.ProofContext import ProofContext, DuplicateBindingError\nfrom SyLoPy.source.ProofValidator import ProofValidator\n\n\ndef test_validator_uses_one_context_for_declarations_and_labels():\n    context = ProofContext()\n    context.bind_label("L1", "formula")\n    assert context.require_label("L1").value == "formula"\n\n    child = context.child()\n    child.bind_label("L2", "child-formula")\n    assert child.require_label("L1").value == "formula"\n    assert context.lookup_label("L2") is None\n\n\ndef test_context_namespace_rejects_declaration_label_collision():\n    context = ProofContext()\n    class Declaration:\n        name = "x"\n    context.declare(Declaration())\n    try:\n        context.bind_label("x", "formula")\n    except DuplicateBindingError:\n        pass\n    else:\n        raise AssertionError("declaration and label must share the proof namespace")\n\n\ndef test_direct_validator_is_public_validator():\n    assert ProofValidator.__name__ == "ProofValidator"\n    assert "context" in ProofValidator._validate_block.__code__.co_varnames\n''')

          # Syntax-check both modules before pytest.
          ast.parse(logic_path.read_text())
          ast.parse((root / 'source' / 'ProofValidator.py').read_text())
          print('direct validator refactor generated successfully')
          PY
          python /tmp/direct_refactor.py
          python -m pip install -r requirements-test.txt
          bash run_tests.sh

      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- source/ProofLogic.py source/ProofValidator.py source/ContextProofValidator.py tests/test_proof_validator_context_integration.py
          git rm -f --ignore-unmatch .github/workflows/refactor-direct.yml
          git commit -m 'refactor validator to use ProofContext directly'
          git push

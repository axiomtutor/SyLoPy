name: one-time architecture refactor

on:
  push:
    branches:
      - parser_ast_elaborationvalidation

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply parser/elaboration consolidation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('source/ProofParser.py')
          text = path.read_text()

          start = text.index('def parse_formula(')
          end = text.index('\ndef parse_justification(', start)
          new_parse_formula = r'''def parse_formula(s: str, bound_vars=None, environment: Optional[TheoryEnvironment] = None):
              """Parse a formula using the language's conventional precedence.

              Precedence, from tightest to loosest, is ``not``, ``and``, ``or``,
              implication, and biconditional.  Quantifiers bind over the formula
              that follows them.  Theory-specific syntax is consulted only after
              the generic logical grammar has determined the expression's shape.
              """
              if bound_vars is None:
                  bound_vars = set()
              if environment is None:
                  environment = _cached_default_environment()
              s = s.strip()

              m = re.match(
                  r'^let\\s+([A-Za-z_][A-Za-z0-9_]*)\\s+be\\s+(?:in\\s+the\\s+domain|arbitrary)\\.?$',
                  s,
                  flags=re.I,
              )
              if m:
                  return fl.AtomicFormula(m.group(1), [])

              m = re.match(
                  r'^(?:for all|forall)\\s+([A-Za-z_][A-Za-z0-9_]*)\\s*,?\\s*(.*)$',
                  s,
                  flags=re.I,
              )
              if m:
                  var, body = m.group(1), m.group(2)
                  return fl.ForAll(var, parse_formula(body, bound_vars | {var}, environment))

              m = re.match(
                  r'^(?:exists|there exists)\\s+([A-Za-z_][A-Za-z0-9_]*)\\s*,?\\s*(.*)$',
                  s,
                  flags=re.I,
              )
              if m:
                  var, body = m.group(1), m.group(2)
                  return fl.Exists(var, parse_formula(body, bound_vars | {var}, environment))

              # Biconditional is the loosest connective.  Test its natural-
              # language spelling before ordinary ``and`` so the embedded word
              # does not become a connective of its own.
              for separator in (' <-> ', ' <=> ', ' ↔ '):
                  parts = split_top_level(s, separator)
                  if len(parts) == 2:
                      return fl.Iff(
                          parse_formula(parts[0], bound_vars, environment),
                          parse_formula(parts[1], bound_vars, environment),
                      )
              parts = re.split(r'\\s+if\\s+and\\s+only\\s+if\\s+', s, maxsplit=1, flags=re.I)
              if len(parts) == 2:
                  return fl.Iff(
                      parse_formula(parts[0], bound_vars, environment),
                      parse_formula(parts[1], bound_vars, environment),
                  )
              parts = split_top_level(s, ' iff ')
              if len(parts) == 2:
                  return fl.Iff(
                      parse_formula(parts[0], bound_vars, environment),
                      parse_formula(parts[1], bound_vars, environment),
                  )

              # Implication is the next-loosest connective and is right-
              # associative: A -> B -> C means A -> (B -> C).
              parts = split_top_level(s, ' -> ')
              if len(parts) == 2:
                  return fl.Implies(
                      parse_formula(parts[0], bound_vars, environment),
                      parse_formula(parts[1], bound_vars, environment),
                  )
              parts = re.split(r'\\s+implies\\s+', s, maxsplit=1, flags=re.I)
              if len(parts) == 2:
                  return fl.Implies(
                      parse_formula(parts[0], bound_vars, environment),
                      parse_formula(parts[1], bound_vars, environment),
                  )
              m = re.match(r'^if\\s+(.*?)\\s+then\\s+(.*)$', s, flags=re.I)
              if m:
                  return fl.Implies(
                      parse_formula(m.group(1), bound_vars, environment),
                      parse_formula(m.group(2), bound_vars, environment),
                  )

              # Disjunction and conjunction are left-associative at the
              # semantic level, represented here by the existing n-ary AST nodes.
              parts = split_top_level(s, ' or ')
              if len(parts) > 1:
                  return fl.Or(*[parse_formula(p, bound_vars, environment) for p in parts])
              parts = split_top_level(s, ' and ')
              if len(parts) > 1:
                  return fl.And(*[parse_formula(p, bound_vars, environment) for p in parts])

              if s.startswith('(') and s.endswith(')'):
                  depth = 0
                  balanced = True
                  for i, ch in enumerate(s):
                      if ch == '(':
                          depth += 1
                      elif ch == ')':
                          depth -= 1
                          if depth == 0 and i != len(s) - 1:
                              balanced = False
                              break
                  if balanced and depth == 0:
                      return parse_formula(s[1:-1], bound_vars, environment)

              m = re.match(r'^(?:not|¬)\\s+(.*)$', s, flags=re.I)
              if m:
                  return fl.Not(parse_formula(m.group(1), bound_vars, environment))

              # Equality is an atomic formula whose operands are terms.
              parts = split_top_level(s, ' = ')
              if len(parts) == 2:
                  return fl.Equals(
                      parse_term(parts[0], bound_vars, environment),
                      parse_term(parts[1], bound_vars, environment),
                  )

              for nested_parser in environment.nested_formula_parsers:
                  formula = nested_parser(s, bound_vars)
                  if formula is not None:
                      return formula

              matched = _match_applied_symbol(s)
              if matched:
                  predicate, args_str = matched
                  return fl.AtomicFormula(
                      predicate,
                      _parse_arg_list(args_str, bound_vars, environment),
                  )

              if _BARE_IDENTIFIER_RE.match(s):
                  return fl.AtomicFormula(s, [])

              raise ValueError(
                  f"Unrecognized formula syntax: {s!r}. Expected a logical "
                  f"connective, an atomic predicate like 'P(x)', a simple "
                  f"atomic proposition name, or syntax registered by an "
                  f"imported theory module."
              )
'''
          text = text[:start] + new_parse_formula + text[end:]

          # Surface declaration parsing must be theory-neutral.  The old
          # generic parser recognized relation aliases and properties itself,
          # duplicating DiscreteMath.RelationDeclarationRecipe.  Leave only
          # generic declaration shape information here; theory recipes own
          # interpretation of descriptors.
          start = text.index('def _surface_declaration_from_clause(')
          end = text.index('\ndef parse_surface_declaration_statement(', start)
          new_surface_decl = r'''def _surface_declaration_from_clause(
              clause: str,
              span: SourceSpan,
          ) -> SurfaceDeclarationClause:
              """Turn a syntactic declaration clause into surface AST.

              This function deliberately performs no theory-specific semantic
              interpretation.  Descriptors such as ``relation on X`` are data
              for a theory's ``DeclarationRecipe`` to interpret later.
              """
              dc = parse_declaration_clause(clause)
              descriptor = dc.descriptor.strip()
              kind, _type_name = _declaration_kind_from_descriptor(descriptor)
              arity = None
              normalized = dc.normalized_descriptor
              if kind == pl.DeclarationKind.PREDICATE:
                  if re.search(r'\\bunary\\b', normalized):
                      arity = 1
                  elif re.search(r'\\bbinary\\b', normalized):
                      arity = 2
              elif kind == pl.DeclarationKind.FUNCTION:
                  if re.search(r'\\bunary\\b', normalized):
                      arity = 1
                  elif re.search(r'\\bbinary\\b', normalized):
                      arity = 2

              declarations = [
                  SurfaceDeclaration(
                      name=name,
                      kind=kind,
                      descriptor=descriptor,
                      attributes={"arity": arity} if arity is not None else {},
                      span=span,
                  )
                  for name in dc.names
              ]
              return SurfaceDeclarationClause(declarations, span)
'''
          text = text[:start] + new_surface_decl + text[end:]

          # A Let statement is surface syntax regardless of whether its
          # justification is "Declare" or "Premise".  This removes the old
          # parse_declaration_prefix path from the parser pipeline.
          old = '''        declaration_statement = None\n        if justification_text.strip().lower() in {"declaration", "declare"}:\n            declaration_statement = parse_surface_declaration_statement(formula_text, line_span)'''
          new = '''        declaration_statement = parse_surface_declaration_statement(formula_text, line_span)'''
          if old not in text:
              raise SystemExit('could not find declaration-statement dispatch')
          text = text.replace(old, new, 1)

          # Compound declarations now own both declaration-only and premise
          # forms.  That makes the Surface AST the sole representation of Let
          # syntax and lets the generic elaborator stop reparsing it.
          old = """    if just not in ('declaration', 'declare'):\n        return None\n"""
          new = """    if just not in ('declaration', 'declare', 'premise'):\n        return None\n"""
          if old not in text:
              raise SystemExit('could not find compound declaration guard')
          text = text.replace(old, new, 1)

          # The premise portion is one formula, not an implicit conjunction
          # of separate clauses.  The formula parser owns conjunction syntax.
          old = """        for formula in split_top_level(premise_body, ' and '):\n            if formula.strip():\n                clauses.append(SurfacePremiseClause(formula.strip(), span))\n"""
          new = """        if premise_body:\n            clauses.append(SurfacePremiseClause(premise_body, span))\n"""
          if old not in text:
              raise SystemExit('could not find premise splitting')
          text = text.replace(old, new, 1)

          # Remove the old declaration-prefix parser and formula-bundle helper
          # now that all Let syntax travels through SurfaceDeclarationStatement.
          for function_name in ('parse_declaration_prefix', '_parse_formula_or_bundle'):
              marker = f'def {function_name}('
              if marker in text:
                  s = text.index(marker)
                  next_match = re.search(r'\n(?:def|class) ', text[s + 1:])
                  if next_match:
                      e = s + 1 + next_match.start()
                  else:
                      raise SystemExit(f'could not find end of {function_name}')
                  text = text[:s] + text[e + 1:]

          # Remove now-unused import-time legacy declaration parsing from the
          # generic fallback in _elaborate_entry_impl.  Line elaborators handle
          # every Let statement before this fallback is reached.
          old = '''            if tag in ('premise', 'declare'):\n                parsed_declarations, remainder = parse_declaration_prefix(entry.formula_text)\n                if parsed_declarations:\n                    declarations = parsed_declarations\n                    if remainder is None:\n                        formula = None\n                    else:\n                        formula = _parse_formula_or_bundle(remainder, self.environment) if tag == 'premise' else self.parse_core_formula(remainder)\n                else:\n                    formula = _parse_formula_or_bundle(entry.formula_text, self.environment) if tag == 'premise' else self.parse_core_formula(entry.formula_text)\n                if declarations:\n                    justification = (tag, declarations)\n            else:\n                formula = self.parse_core_formula(entry.formula_text)\n'''
          new = '''            if tag in ('premise', 'declare'):\n                formula = self.parse_core_formula(entry.formula_text)\n            else:\n                formula = self.parse_core_formula(entry.formula_text)\n'''
          if old not in text:
              raise SystemExit('could not find legacy declaration fallback')
          text = text.replace(old, new, 1)

          path.write_text(text)

          # Keep the architecture documentation truthful after the migration.
          arch = Path('ARCHITECTURE_STATUS.md')
          a = arch.read_text()
          a = a.replace(
              '`ProofParser` is now the public parser facade. The existing parsing machinery\n`is retained in `ProofParserLegacy` for compatibility while language-policy\ncomponents are extracted from it. In particular, justification names are\nresolved by explicit aliases in `ProofJustification`, and formula parsing uses\nconventional precedence (`not`, `and`, `or`, implication, biconditional).',
              '`ProofParser` is the sole public parser and owns the surface-language\nfront end. Formula parsing uses conventional precedence (`not`, `and`, `or`,\nimplication, biconditional), and theory-specific declaration semantics are\nprovided through `TheoryEnvironment` declaration recipes.'
          )
          a = a.replace(
              'The legacy parser still contains historical theory-specific surface parsing.\nThat code is retained deliberately while the corresponding theory recipes are\nintroduced and tested. The next refactor should move relation declaration\nrecognition itself behind the theory environment, then apply the same pattern\nto future order-theory and algebraic syntax.',
              'Legacy declaration-prefix parsing has been removed from the active\npipeline. Relation declaration recognition is owned by the discrete-mathematics\ntheory recipe rather than the generic parser. Future structure syntax should\nfollow the same rule: generic parsing records surface structure; theory modules\ninterpret it.'
          )
          arch.write_text(a)
          PY
      - name: Run regression suite
        run: |
          python -m pip install -r requirements-test.txt
          bash run_tests.sh
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/ProofParser.py ARCHITECTURE_STATUS.md
          git rm .github/workflows/refactor_once.yml
          git commit -m 'Consolidate parser and declaration elaboration architecture'
          git push

name: Tests

on:
  push:
    branches:
      - '*'
    # Skip redundant branch-push runs for documentation-only changes.
    # Pull requests below still run the full suite for every change.
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'todos.txt'
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install -r requirements-test.txt

      - name: Run tests
        run: ./run_tests.sh
name: test

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Apply direct ProofContext refactor
        if: github.ref == 'refs/heads/refactor_validator' && github.actor != 'github-actions[bot]'
        run: python tools/perform_validator_refactor.py
      - name: Run complete test suite
        run: bash run_tests.sh
      - name: Commit completed refactor
        if: github.ref == 'refs/heads/refactor_validator' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/ProofLogic.py source/ProofValidator.py source/ContextProofValidator.py
          git commit -m 'refactor validator to use ProofContext'
          git push
      - name: Remove refactor staging files
        if: github.ref == 'refs/heads/refactor_validator' && github.actor == 'github-actions[bot]'
        run: |
          if [ -f tools/perform_validator_refactor.py ] || [ -f .github/workflows/apply-validator-refactor.yml ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git rm -f tools/perform_validator_refactor.py .github/workflows/apply-validator-refactor.yml 2>/dev/null || true
            git commit -m 'remove validator refactor staging files' || true
            git push || true
          fi
